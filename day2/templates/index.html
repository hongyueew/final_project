<!DOCTYPE html>
<html>
<head>
    <title>{{page_title}}</title>
</head>
<body>
    <h1>Hello {{username}}!</h1>
    {% if message_count > 0 %}
        <p>You have {{message_count}} new messages</p>
    {% else %}
        <p>No new messages</p>
    {% endif %}

    <h2>Your favourite foods:</h2>
    <ul>
    {% for food in foods %}
        <li>{{food}}</li>
    {% endfor %}
    </ul>
</body>
</html>
