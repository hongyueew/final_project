<!DOCTYPE html>
<html>
    <head>
        <title>Favourites</title>
    </head>
    <body>
        <h1>Hello {{name}}!</h1>
        <ol>
        {% for movie in favourites_db[name] %}
            <li>{{movie}}</li>
        {% endfor %}
        </ol>
        {% if favourites_db[name] | length > 5 %}
            <p>Wow you really love movies!</p>
        {% endif %}
    </body>
</html>
