            .card {
                background-color: lightgray;
                padding: 20px;
                margin: 15px;
                border: 1px solid darkgray;
                border-radius: 10px;
                font-family: sans-serif;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>Chickens</h1>
            <p>Chickens are very extremely cute and the best animals in the world. We love them yay.</p>
        </div>
        <div class="card">
            <h1>Ice cream</h1>

        </div>
    </body>
</html>
