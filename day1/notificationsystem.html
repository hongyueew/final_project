<!DOCTYPE html>
<html>
    <head>
        <title>Notification System</title>
        <style>
            .success {
                background-color: lightgreen;
                border: 20px solid green;
                border-left: 50px solid green;
                padding: 20px;
                color: black;
                width: 200px;
                height: 100px;
            }
            .error {
                background-color: pink;
                border: 20px solid red;
                border-left: 50px solid red;
                padding: 20px;
                color: black;
                width: 200px;
                height: 100px;
            }
            .warning {
                background-color: yellow;
                border: 20px solid orange;
                border-left: 50px solid orange;
                padding: 20px;
                color: black;
                width: 200px;
                height: 100px;
            }
            .info {
                background-color: lightblue;
                border: 20px solid blue;
                border-left: 50px solid blue;
                padding: 20px;
                color: black;
                width: 200px;
                height: 100px;
            }
        </style>
    </head>
    <body>
        <div class="success">Success reached!</div>
        <div class="error">Uh oh error</div>
        <div class="warning">You're in danger</div>
        <div class="info">This is very important information</div>
    </body>
</html>
