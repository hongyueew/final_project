<!DOCTYPE html>
<html>
    <head>
        <title>Using Different Selectors</title>
        <style>
            h2 {
                color: purple;
            }
            .featured {
                background-color: lightblue;
                font-weight: bold;
            }
            #page-title {
                font-size: 36px;
            }
            div p {
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1 id="page-title">Hello</h1>
        <div>
            <h2>Chickens</h2>
            <p class="featured">Chickens are really cute</p>
            <p>They are also very funny</p>
        </div>
        <div>
            <h2>Ice cream</h2>
            <p class="featured">Ice cream is very yummy</p>
            <p>It is also very sweet</p>
        </div>
    </body>
</html>
